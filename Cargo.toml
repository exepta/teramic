[workspace]
resolver = "3"
members = ["apps/client", "apps/server", "apps/building-editor", "crates/*"]
default-members = ["apps/client", "apps/server"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
bevy = { version = "~0.20.0", default-features = false, features = ["std", "async_executor", "multi_threaded", "bevy_log"] }
avian3d = { version = "~0.8.0", default-features = false, features = ["3d", "parry-f32", "parallel"] }
lightyear = { version = "~0.31.0", default-features = false, features = ["std"] }
tilt-ui = { path = "../../tilt-us/tilt-ui/crates/tilt-ui" }
tilt-ui-runtime = { path = "../../tilt-us/tilt-ui/crates/tilt-ui-runtime" }
tilt-ui-build = { path = "../../tilt-us/tilt-ui/crates/tilt-ui-build" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "=1.1.3", default-features = false, features = ["alloc", "use-std"] }
bevy_math = { version = "~0.20.0", default-features = false, features = ["std"] }
toml = "0.9"
tracing = "0.1"
thiserror = "2"
noise = "0.9"
fastnoise-lite = { version = "=1.1.1", features = ["f64"] }
block-mesh = "0.2.0"
voxel-traversal = "0.4.0"
ctrlc = { version = "3.5", features = ["termination"] }
uuid = { version = "=1.28.0", features = ["v4", "serde"] }
socket2 = { version = "=0.6.5", features = ["all"] }
terra-core = { path = "crates/terra-core" }
terra-voxel = { path = "crates/terra-voxel" }
terra-world = { path = "crates/terra-world" }
terra-render = { path = "crates/terra-render" }
terra-physics = { path = "crates/terra-physics" }
terra-player = { path = "crates/terra-player" }
terra-network = { path = "crates/terra-network", default-features = false }
terra-storage = { path = "crates/terra-storage" }
terra-ui = { path = "crates/terra-ui" }

[profile.dev]
opt-level = 1
debug = 1
# Avoid retaining hundreds of GiB of incremental snapshots for this workspace.
# Test builds inherit this setting. Recompilation trades CPU time for disk space.
incremental = false

[profile.dev.package."*"]
opt-level = 3
# Keep line tables for our code; third-party debug symbols dwarf the game itself.
debug = 0

# Cargo's wildcard excludes workspace crates. Keep the render/meshing hot paths
# optimized for normal `cargo run` too; debug information and checks stay enabled.
[profile.dev.package.terra-render]
opt-level = 3

[profile.dev.package.terra-voxel]
opt-level = 3

# New terrain is generated while the player moves in ordinary development runs.
[profile.dev.package.terra-world]
opt-level = 3

# Keep simulation tests responsive while avoiding full game optimizations
# and debug symbols for every dependency on hosted CI runners.
[profile.ci]
inherits = "test"
debug = 0

[profile.ci.package."*"]
opt-level = 1

[profile.ci.package.terra-render]
opt-level = 1

[profile.ci.package.terra-voxel]
opt-level = 1

[profile.ci.package.terra-world]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
