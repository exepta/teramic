[workspace]
resolver = "3"
members = ["apps/client", "apps/server", "crates/*"]
exclude = ["vendor/tilt-ui-runtime"]
default-members = ["apps/client", "apps/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
bevy = { version = "~0.19.1", default-features = false, features = ["std", "async_executor", "multi_threaded", "bevy_log"] }
avian3d = { version = "~0.7.0", default-features = false, features = ["3d", "f32", "parry-f32", "parallel"] }
lightyear = { version = "~0.30.1", default-features = false, features = ["std"] }
tilt-ui = { version = "=0.1.0" }
tilt-ui-build = "=0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "=1.1.3", default-features = false, features = ["alloc", "use-std"] }
bevy_math = { version = "~0.19.1", default-features = false, features = ["std"] }
toml = "0.9"
tracing = "0.1"
thiserror = "2"
noise = "0.9"
block-mesh = "0.2.0"
voxel-traversal = "0.4.0"
ctrlc = { version = "3.5", features = ["termination"] }
uuid = { version = "=1.28.0", features = ["v4", "serde"] }
socket2 = { version = "=0.6.5", features = ["all"] }
terra-core = { path = "crates/terra-core" }
terra-voxel = { path = "crates/terra-voxel" }
terra-world = { path = "crates/terra-world" }
terra-render = { path = "crates/terra-render" }
terra-physics = { path = "crates/terra-physics" }
terra-player = { path = "crates/terra-player" }
terra-network = { path = "crates/terra-network", default-features = false }
terra-storage = { path = "crates/terra-storage" }
terra-ui = { path = "crates/terra-ui" }

[patch.crates-io]
tilt-ui-runtime = { path = "vendor/tilt-ui-runtime" }

[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
