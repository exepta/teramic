name: Release packages
on:
  pull_request:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    if: github.event_name == 'push'
    uses: ./.github/workflows/check.yml

  package:
    if: github.event_name == 'push' || startsWith(github.head_ref, 'release/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: macos-15
            platform: macos-arm64
          - runner: windows-2025
            platform: windows-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    env:
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '8'
    defaults:
      run:
        shell: bash
        working-directory: projects/hobby/teramic
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: projects/hobby/teramic
          persist-credentials: false
      - uses: ./projects/hobby/teramic/.github/actions/setup-teramic
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Build client, server and editor
        run: cargo build --release --locked -p terra-client -p terra-server -p terra-building-editor
      - name: Package and run the extracted programs
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          args=(--out dist)
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then args+=(--tag "$GITHUB_REF_NAME"); fi
          python tools/release/package.py "${args[@]}"
          shopt -s nullglob
          archives=(dist/*-"$PLATFORM".tar.gz dist/*-"$PLATFORM".zip)
          [[ ${#archives[@]} == 1 ]]
          python tools/release/verify.py "${archives[0]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.platform }}
          path: projects/hobby/teramic/dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    if: github.event_name == 'push'
    needs: [checks, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - name: Verify and publish archives
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        working-directory: dist
        shell: bash
        run: |
          version=${TAG#v}
          archives=("Teramic-$version-linux-x86_64.tar.gz" "Teramic-$version-macos-arm64.tar.gz" "Teramic-$version-windows-x86_64.zip")
          for archive in "${archives[@]}"; do
            actual=$(sha256sum "$archive")
            [[ "$actual" == "$(tr -d '\r' < "$archive.sha256")" ]]
            echo "$actual" >> SHA256SUMS.txt
          done
          notes="../docs/releases/$TAG.md"
          if gh release view "$TAG" --json isDraft > release.json 2>/dev/null; then
            jq -e '.isDraft' release.json
            gh release upload "$TAG" "${archives[@]}" SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" --draft --verify-tag --title "Teramic $version" --notes-file "$notes" "${archives[@]}" SHA256SUMS.txt
          fi
          gh release edit "$TAG" --draft=false --latest --notes-file "$notes"
