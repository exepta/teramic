name: Release packages
on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Publish the verified candidate for an existing release tag
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source:
    if: >-
      github.event_name == 'push' || startsWith(github.head_ref, 'release/') ||
      (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    outputs:
      run_id: ${{ steps.candidate.outputs.run_id }}
      artifact_ids: ${{ steps.candidate.outputs.artifact_ids }}
      linux_id: ${{ steps.candidate.outputs.linux_id }}
      macos_id: ${{ steps.candidate.outputs.macos_id }}
      windows_id: ${{ steps.candidate.outputs.windows_id }}
    steps:
      - if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          path: tagged-release
          persist-credentials: false
      - if: github.event_name != 'pull_request'
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          args=()
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then args=(--checkout tagged-release); fi
          python3 tools/release/candidate.py find --repo "$GITHUB_REPOSITORY" --tag "$TAG" "${args[@]}" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'workflow_dispatch' && !steps.candidate.outputs.run_id
        run: |
          echo '::error::The tag has no verified candidate. Re-run its original tag build.'
          exit 1
      - if: github.event_name == 'pull_request'
        run: echo 'Building packages for this release candidate.'

  checks:
    needs: source
    if: github.event_name == 'push' && !needs.source.outputs.run_id
    uses: ./.github/workflows/check.yml

  platform:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            artifact: linux_id
            builder: ubuntu-24.04
            runner: ubuntu-24.04
          - platform: macos-arm64
            artifact: macos_id
            builder: macos-15
            runner: macos-15
          - platform: windows-x86_64
            artifact: windows_id
            builder: ubuntu-24.04
            runner: windows-2025
    name: ${{ matrix.platform }}
    uses: ./.github/workflows/native-release.yml
    with:
      platform: ${{ matrix.platform }}
      builder: ${{ matrix.builder }}
      runner: ${{ matrix.runner }}
      acceptance_ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || '' }}
      candidate_run: ${{ needs.source.outputs.run_id }}
      candidate_artifact: ${{ needs.source.outputs[matrix.artifact] }}

  candidate-record:
    needs: platform
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release/candidate.py record --out candidate.json --packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: candidate.json
          if-no-files-found: error
          retention-days: 7

  publish:
    if: >-
      !cancelled() && github.event_name != 'pull_request' && needs.platform.result == 'success' &&
      (needs.checks.result == 'success' || (needs.checks.result == 'skipped' && needs.source.outputs.run_id != ''))
    needs: [source, checks, platform]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || '' }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.source.outputs.artifact_ids }}
          pattern: ${{ !needs.source.outputs.run_id && 'package-*' || '' }}
          github-token: ${{ github.token }}
          run-id: ${{ needs.source.outputs.run_id || github.run_id }}
          merge-multiple: true
          path: dist
      - name: Verify and publish archives
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        working-directory: dist
        shell: bash
        run: |
          version=${TAG#v}
          archives=("Teramic-$version-linux-x86_64.tar.gz" "Teramic-$version-macos-arm64.tar.gz" "Teramic-$version-windows-x86_64.zip")
          for archive in "${archives[@]}"; do
            actual=$(sha256sum "$archive")
            [[ "$actual" == "$(tr -d '\r' < "$archive.sha256")" ]]
            echo "$actual" >> SHA256SUMS.txt
          done
          notes="../docs/releases/$TAG.md"
          if gh release view "$TAG" --json isDraft > release.json 2>/dev/null; then
            jq -e '.isDraft' release.json
            gh release upload "$TAG" "${archives[@]}" SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" --draft --verify-tag --title "Teramic $version" --notes-file "$notes" "${archives[@]}" SHA256SUMS.txt
          fi
          gh release edit "$TAG" --draft=false --latest --notes-file "$notes"
