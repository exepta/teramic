name: Workspace checks
on:
  pull_request:
  workflow_call:
  # Populate a cache on the default branch that subsequent PRs can restore.
  push:
    branches: [main]
    paths:
      - 'Cargo.lock'
      - '**/Cargo.toml'
      - 'rust-toolchain.toml'
      - '.cargo/config.toml'
      - '.github/tilt-ui-revision'
      - '.github/actions/setup-teramic/action.yml'
      - '.github/workflows/check.yml'

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        working-directory: projects/hobby/teramic
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: projects/hobby/teramic
          persist-credentials: false
      - name: Use the Linux runner's available cores
        run: |
          jobs=$(nproc)
          if (( jobs > 4 )); then jobs=4; fi
          echo "CARGO_BUILD_JOBS=$jobs" >> "$GITHUB_ENV"
      - uses: ./projects/hobby/teramic/.github/actions/setup-teramic
        with:
          cache-profile: workspace-checks
      - run: cargo fmt --all -- --check
      - run: cargo clippy --profile ci --workspace --all-targets --locked -- -D warnings
      - run: cargo test --profile ci --workspace --locked --no-fail-fast
      - name: Record the tested release candidate
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/')
        run: python tools/release/candidate.py record --out candidate.json
      - name: Upload workspace check record
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workspace-check-candidate
          path: projects/hobby/teramic/candidate.json
          if-no-files-found: error
          retention-days: 7
