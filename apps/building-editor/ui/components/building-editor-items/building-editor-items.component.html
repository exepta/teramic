@if (editorView.items_open) {
<div class="editor-backdrop"><div id="editor-catalog" class="editor-dialog"><div class="editor-heading"><h1 class="editor-title">{{ editorView.labels.inventory }}</h1><button id="editor-resume" onclick="editor_command"><icon name="close" size="16" />{{ editorView.labels.back }}</button></div><input id="editor-search" type="text" [placeholder]="editorView.labels.search" [value]="editorView.search" onchange="editor_change" /><div class="editor-categories">@for (category of editorView.categories; track category.id) { <button id="editor-category" class="editor-category" onclick="$set(editorIntent.value, category.id); editor_command">{{ category.name }}</button> }</div><div id="editor-item-grid" class="editor-item-grid">@for (item of editorView.items; track item.id) { <button id="editor-select-item" class="editor-item" [title]="item.description" onclick="$set(editorIntent.value, item.id); editor_command"><img [alt]="item.preview" /><p>{{ item.name }}</p></button> }</div><div class="editor-actions"><button id="editor-previous" [disabled]="!editorView.has_previous" onclick="editor_command">{{ editorView.labels.previous }}</button><p>{{ editorView.page }}</p><button id="editor-next" [disabled]="!editorView.has_next" onclick="editor_command">{{ editorView.labels.next }}</button></div></div></div>
}
