@if (editorView.files_open) {
<div class="editor-backdrop"><div id="editor-files" class="editor-dialog"><div class="editor-heading"><h1 class="editor-title">{{ editorView.save ? editorView.labels.save : editorView.labels.load }}</h1><button id="editor-menu" onclick="editor_command">{{ editorView.labels.back }}</button></div><p>{{ editorView.labels.filehint }}</p><div class="editor-field"><label>{{ editorView.labels.directory }}</label><input id="editor-directory" type="text" [value]="editorView.directory" onchange="editor_change" /></div><div class="editor-actions"><button id="editor-parent" onclick="editor_command"><icon name="folder" size="16" />{{ editorView.labels.parent }}</button>@if (!editorView.save) { <button id="editor-default" onclick="editor_command">{{ editorView.labels.default }}</button> }</div><div id="editor-file-list" class="editor-file-list">@for (entry of editorView.files; track entry.path) { <button id="editor-file" class="editor-file" onclick="$set(editorIntent.value, entry.path); editor_command"><icon name="file" size="16" [src]="entry.icon" /><p>{{ entry.name }}</p></button> }</div>@if (editorView.save) { <div class="editor-save-fields"><div class="editor-field"><label>{{ editorView.labels.name }}</label><input id="editor-name" type="text" maxlength="80" [value]="editorView.name" onchange="editor_change" /></div><div class="editor-field"><label>{{ editorView.labels.filename }}</label><input id="editor-filename" type="text" maxlength="64" [value]="editorView.filename" onchange="editor_change" /></div></div><button id="editor-write" class="editor-primary" onclick="editor_command">{{ editorView.labels.write }}</button> }</div></div>
}
