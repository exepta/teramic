<div id="options-page" class="options-page copper-menu-page">
  <div class="copper-frame-background"></div><img class="inventory-reference-frame" src="tilt-ui://assets/inventory-copper-frame.png" alt="" />
  <div class="inventory-reference-title copper-menu-title"><p class="title-diamond">◆</p><h1 class="copper-page-title">Settings</h1><p class="title-diamond">◆</p></div>
  <div class="copper-options-content">
    <div id="settings-tabs" class="tabs copper-options-tabs">
      <button id="graphics" [class]="optionsView.graphics ? 'tab selected' : 'tab'" onclick="menu_command"><icon name="mountain" size="28" /><p>Graphics</p></button>
      <button id="controls" [class]="optionsView.controls ? 'tab selected' : 'tab'" onclick="menu_command"><icon name="gamepad-2" size="28" /><p>Controls</p></button>
      <button id="gameplay-options" [class]="optionsView.gameplay ? 'tab selected' : 'tab'" onclick="menu_command"><icon name="leaf" size="28" /><p>Gameplay</p></button>
      <button id="audio" [class]="optionsView.audio ? 'tab selected' : 'tab'" onclick="menu_command"><icon name="headphones" size="28" /><p>Audio</p></button>
      <button id="multiplayer-options" [class]="optionsView.multiplayer ? 'tab selected' : 'tab'" onclick="menu_command"><icon name="users-round" size="28" /><p>Multiplayer</p></button>
    </div>
    <div class="options-panel copper-options-panel"><div id="settings-list" class="settings-list">@for (row of optionsView.rows; track row.id) { <settings-row></settings-row> }</div></div>
  </div>
  @if (optionsView.listening) { <p class="binding-prompt">{{ optionsView.prompt }}</p> }
  <div class="action-bar options-actions copper-menu-actions">@for (button of optionsView.buttons; track button.id) { <menu-button></menu-button> }</div>
</div>
