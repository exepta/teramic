<div id="options-page" class="options-page copper-menu-page">
  <div class="copper-frame-background"></div><img class="inventory-reference-frame" src="tilt-ui://assets/inventory-copper-frame.png" alt="" />
  <div class="inventory-reference-title copper-menu-title"><p class="title-diamond">◆</p><h1 class="copper-page-title">{{ i18n.text_settings_74a883a037bc }}</h1><p class="title-diamond">◆</p></div>
  <div class="copper-options-content">
    <div id="settings-tabs" class="tabs copper-options-tabs">
      <button id="graphics" [class]="optionsView.graphics ? 'tab selected' : 'tab'" onclick="menu_command"><icon name="mountain" size="28" /><p>{{ i18n.text_graphics_a874fca87cdd }}</p></button>
      <button id="controls" [class]="optionsView.controls ? 'tab selected' : 'tab'" onclick="menu_command"><icon name="gamepad-2" size="28" /><p>{{ i18n.text_controls_799c26913574 }}</p></button>
      <button id="gameplay-options" [class]="optionsView.gameplay ? 'tab selected' : 'tab'" onclick="menu_command"><icon name="leaf" size="28" /><p>{{ i18n.text_gameplay_31bcb8940fff }}</p></button>
      <button id="audio" [class]="optionsView.audio ? 'tab selected' : 'tab'" onclick="menu_command"><icon name="headphones" size="28" /><p>{{ i18n.text_audio_bc1b88907d3b }}</p></button>
      <button id="multiplayer-options" [class]="optionsView.multiplayer ? 'tab selected' : 'tab'" onclick="menu_command"><icon name="users-round" size="28" /><p>{{ i18n.text_multiplayer_563370a7b0ef }}</p></button>
    </div>
    <div class="options-panel copper-options-panel"><div id="settings-list" class="settings-list">@for (row of localizedUi.optionsView.rows; track row.id) { <settings-row></settings-row> }</div></div>
  </div>
  @if (optionsView.listening) { <p class="binding-prompt">{{ localizedUi.optionsView.prompt }}</p> }
  <div class="action-bar options-actions copper-menu-actions">@for (button of localizedUi.optionsView.buttons; track button.id) { <menu-button></menu-button> }</div>
</div>
