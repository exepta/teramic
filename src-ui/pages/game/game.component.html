<div class="game-overlay">
  @if (!settingsView.open && !inventoryView.open && !trainView.open && !chatView.open && !petMenuView.visible && !kingdomView.visible && !survivalView.dead && !survivalView.editing) { <div class="crosshair"><div class="crosshair-h"></div><div class="crosshair-v"></div></div> }
  <inventory-panel></inventory-panel>
  <settings-menu></settings-menu>
  <network-notice></network-notice>
  <sleep-overlay></sleep-overlay>
  <chat-panel></chat-panel>
  <survival-hud></survival-hud>
  <target-card></target-card>
  <world-waypoints></world-waypoints>
  @if (!debugOverlay.visible) { <mini-map></mini-map> }
  <full-map></full-map>
  <multiplayer-hud></multiplayer-hud>
  <mob-health></mob-health>
  <pet-menu></pet-menu>
  <kingdom-menu></kingdom-menu>
  <train-workshop></train-workshop>
  <realm-title></realm-title>
  <debug-overlay></debug-overlay>
</div>
