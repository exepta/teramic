<div id="multiplayer-page" class="library-page copper-menu-page">
  <div class="copper-frame-background"></div><img class="inventory-reference-frame" src="tilt-ui://assets/inventory-copper-frame.png" alt="" />
  <div class="inventory-reference-title copper-menu-title"><icon name="users-round" size="25" /><h1 class="copper-page-title">Multiplayer</h1><icon name="users-round" size="25" /></div>
  <div class="library-panel copper-worlds-panel"><div class="list-heading copper-server-heading"><h2 class="copper-server-count">{{ serversView.count }}</h2><p>{{ serversView.discovery }}</p></div>
    <div class="card-list">
    @if (serversView.empty) { <div class="empty-state"><icon name="users-round" size="44" /><h2>Find your people</h2><p>No saved servers yet.</p></div> }
    @for (card of serversView.cards; track card.id) { <server-card></server-card> }
    </div>
  </div>
  <div class="action-bar copper-menu-actions">@for (button of serversView.buttons; track button.id) { <menu-button></menu-button> }</div>
</div>
