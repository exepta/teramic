<div id="singleplayer-page" class="library-page copper-menu-page">
  <div class="copper-frame-background"></div><img class="inventory-reference-frame" src="tilt-ui://assets/inventory-copper-frame.png" alt="" />
  <div class="inventory-reference-title copper-menu-title"><icon name="leaf" size="25" /><h1 class="copper-page-title">Singleplayer</h1><icon name="leaf" size="25" /></div>
  <div class="library-panel copper-worlds-panel">
    <div id="world-card-list" class="card-list">
      @if (worldsView.empty) { <div class="empty-state"><icon name="mountain" size="44" /><h2>A world of your own</h2><p>No saved worlds yet.</p></div> }
      @for (card of worldsView.cards; track card.id) { <world-card></world-card> }
    </div>
  </div>
  <div class="action-bar copper-menu-actions">@for (button of worldsView.buttons; track button.id) { <menu-button></menu-button> }</div>
</div>
