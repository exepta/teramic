@if (petMenuView.visible) {
  <div class="pet-command-overlay">
    <div id="pet-command-panel" [class]="petMenuView.tiny ? 'pet-command-panel compact tiny' : (petMenuView.compact ? 'pet-command-panel compact' : 'pet-command-panel')" [style]="petMenuView.style">
      <img id="pet-command-frame" class="pet-command-art" alt="Pet command ring" [style]="petMenuView.art_style" />
      <img id="pet-model-portrait" class="pet-portrait" alt="Pet preview" [style]="petMenuView.portrait_style" />
      <div id="pet-follow-description" class="pet-description follow-description" [style]="petMenuView.follow_info_style"><img class="pet-plaque" alt="Pet follow plaque" /><div class="pet-description-text"><p class="pet-description-title">Follow</p><p>Stays close to you</p></div></div>
      <div id="pet-rest-description" class="pet-description rest-description" [style]="petMenuView.rest_info_style"><img class="pet-plaque" [alt]="petMenuView.compact ? 'Pet compact plaque' : 'Pet rest plaque'" /><div class="pet-description-text"><p class="pet-description-title">Rest</p><p>Stays at the current position</p></div></div>
      <div id="pet-none-description" class="pet-description none-description" [style]="petMenuView.none_info_style"><img class="pet-plaque" [alt]="petMenuView.compact ? 'Pet compact plaque' : 'Pet none plaque'" /><div class="pet-description-text"><p class="pet-description-title">None</p><p>Does nothing</p></div></div>
      <button id="pet-follow" [class]="petMenuView.follow ? 'pet-choice pet-follow active' : 'pet-choice pet-follow'" [style]="petMenuView.follow_style" [disabled]="petMenuView.pending" onclick="pet_menu_action" onmouseenter="pet_menu_action" title="Follow"><img class="pet-paw" alt="Pet command paw" /><div id="pet-follow-label" class="pet-choice-label"><p>Follow</p></div></button>
      <button id="pet-rest" [class]="petMenuView.rest ? 'pet-choice pet-rest active' : 'pet-choice pet-rest'" [style]="petMenuView.rest_style" [disabled]="petMenuView.pending" onclick="pet_menu_action" onmouseenter="pet_menu_action" title="Rest"><icon name="bed-double" size="64"></icon><div id="pet-rest-label" class="pet-choice-label"><p>Rest</p></div></button>
      <button id="pet-none" [class]="petMenuView.free ? 'pet-choice pet-none active' : 'pet-choice pet-none'" [style]="petMenuView.none_style" [disabled]="petMenuView.pending" onclick="pet_menu_action" onmouseenter="pet_menu_action" title="None"><icon name="circle-x" size="64"></icon><div id="pet-none-label" class="pet-choice-label"><p>None</p></div></button>
      <div id="pet-nameplate" class="pet-caption" [style]="petMenuView.caption_style" [title]="petMenuView.health"><p class="pet-name">{{ petMenuView.title }}</p><div class="pet-hearts">@for (heart of petMenuView.hearts; track heart.id) { <img class="pet-heart" alt="Pet health heart" [style]="heart.style" /> }</div></div>
      <button id="pet-close" class="pet-close" onclick="pet_menu_action" title="Close"><icon name="x"></icon></button>
      @if (petMenuView.pending) { <p class="pet-command-status">...</p> }
      @if (petMenuView.error != '') { <p class="pet-command-error">{{ petMenuView.error }}</p> }
    </div>
  </div>
}
