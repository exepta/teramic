<div id="item-browser" [class]="inventoryView.player ? 'item-browser reference-browser' : (inventoryView.linked_container ? 'item-browser reference-browser machine-item-browser machine-linked-browser' : 'item-browser reference-browser machine-item-browser')">
  <div class="browser-search"><icon name="search" size="23" /><input class="inventory-search-field" id="inventory-search" type="text" [placeholder]="i18n.text_search_7f55382219f0" [value]="inventoryView.search" onchange="inventory_search" /><button id="inventory-browser-filter" class="browser-filter" [title]="i18n.text_reset_category_filter_12f63a0a6f63" onclick="inventory_action"><icon name="filter" size="25" /></button></div>
  <div class="browser-pagination"><button id="inventory-page-previous" class="pagination-previous" [title]="i18n.text_previous_item_page_bcbea16ede81" [disabled]="!inventoryView.browser_previous" onclick="inventory_action"><icon name="chevron-left" size="24" /></button><div class="pagination-label"><p id="inventory-browser-page">{{ localizedUi.inventoryView.browser_page }}</p></div><button id="inventory-page-next" class="pagination-next" [title]="i18n.text_next_item_page_419cd8cdaa4b" [disabled]="!inventoryView.browser_next" onclick="inventory_action"><icon name="chevron-right" size="24" /></button></div>
  <div id="inventory-categories-host" class="browser-category-host">
    <div id="inventory-categories" class="browser-categories">@for (category of localizedUi.inventoryView.categories; track category.id) { <div class="browser-category-cell"><inventory-category [category]="category" /></div> }</div>
    <button id="inventory-trash" class="inventory-rail-trash inventory-action-button" [title]="i18n.text_delete_stack_ctrl_clear_inventory_80beb673c24c" [disabled]="!inventoryView.creative || !inventoryView.trash_available" onclick="inventory_action"><icon class="inventory-trash-icon" name="trash" size="22" /></button>
  </div>
  <div id="inventory-browser-grid" class="browser-grid">@for (slot of localizedUi.inventoryView.browser_items; track slot.id) { <inventory-slot [slot]="slot" /> }</div>
  @if (inventoryView.empty) { <p class="browser-empty">{{ i18n.text_no_matching_items_4d1d1512718e }}</p> }
</div>
