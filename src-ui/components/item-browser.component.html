<div id="item-browser" [class]="inventoryView.player ? 'item-browser reference-browser' : (inventoryView.linked_container ? 'item-browser reference-browser machine-item-browser machine-linked-browser' : 'item-browser reference-browser machine-item-browser')">
  <div class="browser-search"><icon name="search" size="23" /><input class="inventory-search-field" id="inventory-search" type="text" placeholder="Search..." [value]="inventoryView.search" onchange="inventory_search" /><button id="inventory-browser-filter" class="browser-filter" title="Reset category filter" onclick="inventory_action"><icon name="filter" size="25" /></button></div>
  <div class="browser-pagination"><button id="inventory-page-previous" class="pagination-previous" title="Previous item page" [disabled]="!inventoryView.browser_previous" onclick="inventory_action"><icon name="chevron-left" size="24" /></button><div class="pagination-label"><p id="inventory-browser-page">{{ inventoryView.browser_page }}</p></div><button id="inventory-page-next" class="pagination-next" title="Next item page" [disabled]="!inventoryView.browser_next" onclick="inventory_action"><icon name="chevron-right" size="24" /></button></div>
  <div id="inventory-categories-host" class="browser-category-host">
    <div id="inventory-categories" class="browser-categories">@for (category of inventoryView.categories; track category.id) { <div class="browser-category-cell"><inventory-category [category]="category" /></div> }</div>
    <button id="inventory-trash" class="inventory-rail-trash" title="Delete stack / Ctrl: clear inventory" [disabled]="!inventoryView.creative || !inventoryView.trash_available" onclick="inventory_action"><icon class="inventory-trash-icon" name="trash" size="22" /></button>
  </div>
  <div id="inventory-browser-grid" class="browser-grid">@for (slot of inventoryView.browser_items; track slot.id) { <inventory-slot [slot]="slot" /> }</div>
  @if (inventoryView.empty) { <p class="browser-empty">No matching items</p> }
</div>
