    "file-dialog",
    "svg",
]
file-dialog = [
    "dep:rfd",
    "dep:wasm-bindgen-futures",
]
fluent = [
    "component",
    "dep:fluent-bundle",
    "dep:unic-langid",
    "dep:sys-locale",
]
