[package]
name = "terra-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bevy = { workspace = true, features = ["bevy_pbr", "bevy_core_pipeline", "bevy_post_process", "bevy_anti_alias", "bevy_asset", "bevy_gltf", "bevy_ui", "bevy_ui_render", "zstd_rust", "bevy_gizmos", "bevy_gizmos_render"] }
terra-core = { workspace = true, features = ["bevy"] }
terra-world = { workspace = true, features = ["bevy"] }
terra-player.workspace = true
terra-voxel.workspace = true
terra-network = { workspace = true, features = ["client"] }
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The painted-albedo asset test decodes PNG without relying on client features.
bevy = { workspace = true, features = ["png"] }
wesl = "=0.6.0"

# Validate fully composed native vertex shaders without requiring a GPU.
naga = { version = "=30.0.1", features = ["wgsl-in"] }
