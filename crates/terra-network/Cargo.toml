[package]
name = "terra-network"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["client", "server"]
client = ["lightyear/client"]
server = ["lightyear/server"]

[dependencies]
bevy.workspace = true
lightyear = { workspace = true, features = ["udp", "netcode"] }
terra-core = { workspace = true, features = ["bevy"] }
terra-voxel.workspace = true
serde.workspace = true
terra-world = { workspace = true, features = ["bevy"] }
terra-physics.workspace = true
tracing.workspace = true
serde_json.workspace = true
socket2.workspace = true
avian3d.workspace = true
