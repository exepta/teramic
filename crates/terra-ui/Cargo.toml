[package]
name = "terra-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bevy = { workspace = true, features = ["bevy_ui_render", "bevy_input_focus", "default_font", "bevy_pbr"] }
terra-core = { workspace = true, features = ["bevy", "controls"] }
terra-storage.workspace=true
toml.workspace=true
terra-world = { workspace = true, features = ["bevy"] }
terra-voxel.workspace = true
terra-player.workspace = true
terra-network = { workspace = true, features = ["client"] }
tilt-ui = { workspace = true, features = ["tilt-icons"] }
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
tilt-ui-build.workspace = true
